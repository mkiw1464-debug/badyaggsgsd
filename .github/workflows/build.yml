name: Build FF External IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build (unsigned)
        run: |
          set -o pipefail
          PROJ=$(find "$GITHUB_WORKSPACE" -name "FFExternal.xcodeproj" -maxdepth 3 | head -1)
          PROJ_DIR=$(dirname "$PROJ")
          cd "$PROJ_DIR"

          xcodebuild archive \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FFExternal.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee /tmp/xcodebuild.log
          echo "Exit: ${PIPESTATUS[0]}"

      - name: Show log on failure
        if: failure()
        run: tail -300 /tmp/xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/FFExternal.xcarchive" -name "*.app" -maxdepth 5 | head -1)
          echo "App: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r FFExternal.ipa Payload/
          echo "Done: $(du -sh FFExternal.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-${{ github.run_number }}
          path: ${{ env.RUNNER_TEMP }}/FFExternal.ipa
          retention-days: 30
