name: Diagnose Xcode Project

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect exact project
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          echo "===== XCODE ====="
          xcodebuild -version
          xcode-select -p

          echo "===== GIT ====="
          git rev-parse HEAD

          echo "===== PROJECT FILE ====="
          ls -lah "$PROJECT"
          file "$PROJECT"

          echo "===== FIRST 30 LINES ====="
          nl -ba "$PROJECT" | head -n 30

          echo "===== LAST 30 LINES ====="
          nl -ba "$PROJECT" | tail -n 30

      - name: Check hidden characters
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          echo "===== HEX FIRST 200 BYTES ====="
          xxd -l 200 "$PROJECT"

          echo "===== NON-ASCII / CONTROL CHARACTERS ====="

          python3 <<'PY'
          from pathlib import Path

          p = Path("FFExternal.xcodeproj/project.pbxproj")
          data = p.read_bytes()

          for i, b in enumerate(data):
              if b < 32 and b not in (9, 10, 13):
                  print(
                      f"CONTROL BYTE: offset={i}, value=0x{b:02x}"
                  )

          print("Finished byte scan.")
          PY

      - name: Check Xcode project IDs
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("FFExternal.xcodeproj/project.pbxproj")
          text = p.read_text(encoding="utf-8")

          ids = re.findall(
              r'(?<![A-Za-z0-9_])([A-Za-z0-9_]+)(?=\s*/\*|\s*=)',
              text
          )

          print("Potential object IDs:")

          for x in ids:
              if len(x) >= 20:
                  print(x)

          print()
          print("FFEX occurrences:", len(re.findall(r'\bFFEX', text)))
          print("UTF8 headers:", text.count("// !$*UTF8*$!"))
          PY

      - name: Test original project
        run: |
          set +e

          xcodebuild \
            -project FFExternal.xcodeproj \
            -list \
            > /tmp/xcodebuild.out \
            2>&1

          STATUS=$?

          echo "===== XCODEBUILD OUTPUT ====="
          cat /tmp/xcodebuild.out

          echo
          echo "===== EXIT CODE ====="
          echo "$STATUS"

          exit 0

      - name: Search for conflict markers
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          echo "===== GIT CONFLICT MARKERS ====="

          grep -nE \
            '^(<<<<<<<|=======|>>>>>>>)' \
            "$PROJECT" || true

      - name: Create parser variants
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          cp "$PROJECT" /tmp/original.pbxproj

          # Variant 1: remove UTF8 comment
          tail -n +2 "$PROJECT" > /tmp/no-header.pbxproj

          # Variant 2: remove comments
          sed -E \
            's@//.*$@@' \
            "$PROJECT" \
            > /tmp/no-comments.pbxproj

          echo "Created diagnostic variants."

          echo "===== ORIGINAL ====="
          head -n 3 /tmp/original.pbxproj

          echo "===== NO HEADER ====="
          head -n 3 /tmp/no-header.pbxproj

          echo "===== NO COMMENTS ====="
          head -n 10 /tmp/no-comments.pbxproj
