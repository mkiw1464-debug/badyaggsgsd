name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode information
        run: |
          set -eux

          echo "Developer:"
          xcode-select -p

          echo "Xcode:"
          xcodebuild -version

          echo "Commit:"
          git rev-parse HEAD

      - name: Repair Xcode project IDs
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          test -f "$PROJECT"

          cp "$PROJECT" "$PROJECT.original"

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          path = Path("FFExternal.xcodeproj/project.pbxproj")
          text = path.read_text(encoding="utf-8")

          # Find all custom FFEX object IDs.
          ids = sorted(
              set(
                  re.findall(
                      r'\bFFEX[0-9A-Za-z]+\b',
                      text
                  )
              )
          )

          print("Found object IDs:", len(ids))

          mapping = {}

          for old in ids:
              # Deterministic 24-character hexadecimal ID.
              new = hashlib.sha256(
                  old.encode("utf-8")
              ).hexdigest()[:24].upper()

              mapping[old] = new

          # Check for collisions.
          reverse = {}

          for old, new in mapping.items():
              if new in reverse and reverse[new] != old:
                  raise SystemExit(
                      f"ID collision: {old} and {reverse[new]} -> {new}"
                  )
              reverse[new] = old

          # Replace IDs everywhere they occur.
          for old, new in mapping.items():
              text = re.sub(
                  rf'\b{re.escape(old)}\b',
                  new,
                  text
              )

          path.write_text(text, encoding="utf-8")

          print()
          print("===== ID CONVERSION =====")

          for old, new in mapping.items():
              print(f"{old} -> {new}")

          print()
          print("Project repaired in CI.")
          PY

      - name: Verify repaired project
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          echo "===== FIRST LINES ====="
          head -n 10 "$PROJECT"

          echo "===== REMAINING FFEX IDs ====="
          grep -oE '\bFFEX[0-9A-Za-z]+\b' "$PROJECT" | sort -u || true

          echo "===== BASIC STRUCTURE ====="

          python3 <<'PY'
          from pathlib import Path

          p = Path("FFExternal.xcodeproj/project.pbxproj")
          data = p.read_bytes()
          text = data.decode("utf-8")

          print("UTF-8: OK")
          print("Bytes:", len(data))
          print("Opening braces:", text.count("{"))
          print("Closing braces:", text.count("}"))
          print("Opening parentheses:", text.count("("))
          print("Closing parentheses:", text.count(")"))

          if text.count("{") != text.count("}"):
              raise SystemExit("Unbalanced braces")

          if text.count("(") != text.count(")"):
              raise SystemExit("Unbalanced parentheses")

          if not text.rstrip().endswith("}"):
              raise SystemExit("Project does not end correctly")

          print("Structure: OK")
          PY

      - name: Xcode project test
        run: |
          set -eux

          xcodebuild \
            -project FFExternal.xcodeproj \
            -list

      - name: Clean
        run: |
          set -eux

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            clean \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive
        run: |
          set -eux

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FFExternal.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify application
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          if [ ! -d "$APP" ]; then
            echo "FFExternal.app was not produced."
            find build -maxdepth 6 -print
            exit 1
          fi

          echo "Application found:"
          ls -lah "$APP"

      - name: Create IPA
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/FFExternal.app

          cd build

          zip -qry FFExternal.ipa Payload

          test -f FFExternal.ipa

          echo "===== IPA CREATED ====="
          ls -lh FFExternal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: build/FFExternal.ipa
          if-no-files-found: error
