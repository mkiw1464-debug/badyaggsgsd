name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate clean Xcode project
        run: |
          set -eux

          rm -rf GeneratedApp
          mkdir -p GeneratedApp

          cat > GeneratedApp/project.yml <<'YAML'
name: FFExternal

options:
  bundleIdPrefix: com.example

targets:
  FFExternal:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: ../FFExternal
        excludes:
          - "**/*.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ffexternal
        PRODUCT_NAME: FFExternal
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: FFExternal
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
YAML

          cd GeneratedApp
          xcodegen generate

          echo "===== GENERATED PROJECT ====="
          ls -la

          cd ..

      - name: Show generated project
        run: |
          set -eux

          xcodebuild \
            -project GeneratedApp/FFExternal.xcodeproj \
            -list

      - name: Build archive
        run: |
          set -eux

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project GeneratedApp/FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FFExternal.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: App was not produced."
            find build -maxdepth 6 -print
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/FFExternal.app

          cd build

          zip -qry FFExternal.ipa Payload

          echo "===== IPA CREATED ====="
          ls -lh FFExternal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: build/FFExternal.ipa
          if-no-files-found: error
