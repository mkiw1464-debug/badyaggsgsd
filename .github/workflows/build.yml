name: Build iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Repair Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PBX="FFExternal.xcodeproj/project.pbxproj"

          if [ ! -f "$PBX" ]; then
            echo "ERROR: $PBX not found"
            exit 1
          fi

          echo "Checking project file..."

          python3 - "$PBX" <<'PY'
          import sys

          path = sys.argv[1]
          marker = "// !$*UTF8*$!"

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          positions = []
          offset = 0

          while True:
              pos = data.find(marker, offset)

              if pos == -1:
                  break

              positions.append(pos)
              offset = pos + len(marker)

          print(f"Found {len(positions)} Xcode project header(s)")

          if not positions:
              raise SystemExit("ERROR: No Xcode project header found")

          if len(positions) > 1:
              print("Duplicate project detected.")
              print("Keeping the last project definition.")

              data = data[positions[-1]:]

              with open(path, "w", encoding="utf-8") as f:
                  f.write(data)

              print("project.pbxproj repaired.")
          else:
              print("No duplicate project definition found.")

          PY

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project structure..."

          HEADER_COUNT=$(grep -cF '// !$*UTF8*$!' FFExternal.xcodeproj/project.pbxproj || true)

          echo "Project headers: $HEADER_COUNT"

          if [ "$HEADER_COUNT" -ne 1 ]; then
            echo "ERROR: project.pbxproj still has an invalid number of headers."
            exit 1
          fi

          echo "Running xcodebuild -list..."

          xcodebuild \
            -list \
            -project FFExternal.xcodeproj

      - name: Archive
        shell: bash
        run: |
          set -o pipefail

          mkdir -p "$RUNNER_TEMP/FFExternal"

          xcodebuild archive \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FFExternal/FFExternal.xcarchive" \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-xcarchive
          path: ${{ runner.temp }}/FFExternal/FFExternal.xcarchive
