name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: |
          set -eux

          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          echo "Current developer directory:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

      - name: Prepare project
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          test -f "$PROJECT"

          echo "Before:"
          head -n 5 "$PROJECT"

          # Remove the OpenStep UTF-8 comment only in CI.
          # The original repository file is not modified remotely.
          sed -i.bak '1{/^\/\/ !\$\*UTF8\*\$!$/d;}' "$PROJECT"

          echo "After:"
          head -n 5 "$PROJECT"

          echo "Header count:"
          grep -cF '// !$*UTF8*$!' "$PROJECT" || true

      - name: Validate Xcode project
        run: |
          set -eux

          xcodebuild \
            -project FFExternal.xcodeproj \
            -list

      - name: Clean
        run: |
          set -eux

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            clean \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive
        run: |
          set -eux

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FFExternal.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check app
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: FFExternal.app was not produced."
            find build -maxdepth 5 -type d -print
            exit 1
          fi

          echo "App produced:"
          ls -lah "$APP"

      - name: Package IPA
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/FFExternal.app

          cd build
          /usr/bin/zip -qry FFExternal.ipa Payload

          test -f FFExternal.ipa

          echo "IPA created:"
          ls -lh FFExternal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: build/FFExternal.ipa
          if-no-files-found: error
