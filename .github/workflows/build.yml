name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode info
        run: |
          set -eux

          echo "Developer:"
          xcode-select -p

          echo "Xcode:"
          xcodebuild -version

          echo "Commit:"
          git rev-parse HEAD

      - name: Inspect project
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          test -f "$PROJECT"

          echo "===== FIRST 10 LINES ====="
          nl -ba "$PROJECT" | head -n 10

          echo "===== LAST 10 LINES ====="
          nl -ba "$PROJECT" | tail -n 10

          echo "===== UTF8 HEADER ====="
          grep -nF '// !$*UTF8*$!' "$PROJECT" || true

          echo "===== FILE TYPE ====="
          file "$PROJECT"

          echo "===== FILE SIZE ====="
          wc -c "$PROJECT"

      - name: Validate project structure
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          python3 <<'PY'
          from pathlib import Path

          p = Path("FFExternal.xcodeproj/project.pbxproj")
          data = p.read_bytes()

          print("bytes:", len(data))
          print("starts with UTF8 header:", data.startswith(b"// !$*UTF8*$!"))
          print("contains NUL:", b"\x00" in data)
          print("contains CR:", b"\r" in data)

          text = data.decode("utf-8")

          print("UTF-8: OK")
          print("opening braces:", text.count("{"))
          print("closing braces:", text.count("}"))
          print("opening parens:", text.count("("))
          print("closing parens:", text.count(")"))

          if text.count("{") != text.count("}"):
              raise SystemExit("ERROR: unmatched { }")

          if text.count("(") != text.count(")"):
              raise SystemExit("ERROR: unmatched ( )")

          if not text.rstrip().endswith("}"):
              raise SystemExit("ERROR: project does not end with }")

          print("Basic structure: OK")
          PY

      - name: Test plist parser
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          # plutil on macOS does not like the Xcode OpenStep UTF8 comment
          # as the first line, so validate a temporary copy without it.
          tail -n +2 "$PROJECT" > /tmp/project-no-header.pbxproj

          echo "===== plutil result ====="

          if plutil -lint /tmp/project-no-header.pbxproj; then
            echo "plutil: OK"
          else
            echo "plutil rejected the OpenStep project syntax."
            echo "This is diagnostic only; it is NOT used as the Xcode build input."
          fi

      - name: Xcode project parser test
        run: |
          set -o pipefail

          xcodebuild \
            -project FFExternal.xcodeproj \
            -list \
            2>&1 | tee /tmp/xcode-project.log

      - name: Show parser diagnostics
        if: failure()
        run: |
          echo "===== XCODE PROJECT LOG ====="
          cat /tmp/xcode-project.log || true

          echo "===== PROJECT AROUND BEGINNING ====="
          nl -ba FFExternal.xcodeproj/project.pbxproj | sed -n '1,40p'

          echo "===== PROJECT AROUND END ====="
          nl -ba FFExternal.xcodeproj/project.pbxproj | tail -n 40

      - name: Clean
        run: |
          set -eux

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            clean \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive
        run: |
          set -eux

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FFExternal.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          test -d "$APP"

          echo "APP:"
          ls -lah "$APP"

      - name: Package IPA
        run: |
          set -eux

          APP="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/FFExternal.app

          cd build

          /usr/bin/zip \
            -qry \
            FFExternal.ipa \
            Payload

          test -f FFExternal.ipa

          echo "===== IPA ====="
          ls -lh FFExternal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: build/FFExternal.ipa
          if-no-files-found: error
