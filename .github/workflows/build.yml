name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux
          xcode-select -p
          xcodebuild -version
          git rev-parse HEAD
          git status --short

      - name: Check project file
        run: |
          set -eux

          PROJECT="FFExternal.xcodeproj/project.pbxproj"

          test -f "$PROJECT"

          echo "===== project.pbxproj first lines ====="
          sed -n '1,20p' "$PROJECT"

          echo "===== project.pbxproj last lines ====="
          tail -n 20 "$PROJECT"

          echo "===== UTF8 header count ====="
          grep -cF '// !$*UTF8*$!' "$PROJECT" || true

          echo "===== plutil validation ====="
          plutil -lint "$PROJECT"

      - name: List Xcode project
        run: |
          set -eux
          xcodebuild \
            -project FFExternal.xcodeproj \
            -list

      - name: Clean
        run: |
          set -eux
          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            clean \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          set -eux

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FFExternal.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          set -eux

          APP_PATH="build/FFExternal.xcarchive/Products/Applications/FFExternal.app"

          test -d "$APP_PATH"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/FFExternal.app

          cd build
          zip -qry FFExternal.ipa Payload

          test -f FFExternal.ipa

          echo "===== IPA ====="
          ls -lh FFExternal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: build/FFExternal.ipa
          if-no-files-found: error

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-XCArchive
          path: build/FFExternal.xcarchive
          if-no-files-found: error
